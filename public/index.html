<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - CDGS School Core</title>
  <meta name="description" content="Masuk ke platform talent siswa CDGS School Core.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <main class="login-card" id="login-card">
      <section class="login-form-panel" aria-labelledby="login-title">
        <p class="login-brand">CDGS <span>School Core</span></p>
        <h1 id="login-title">Selamat datang kembali</h1>
        <p class="login-intro">Masuk ke ruang kerja sekolah Anda.</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              aria-required="true"
            >
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Kata sandi</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              aria-required="true"
            >
          </div>
          <button type="submit" class="btn-primary" id="login-btn">Masuk</button>
          <p class="error-msg" id="error-message" role="alert" aria-live="assertive"></p>
        </form>
      </section>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Jika token sudah ada dan valid, langsung ke dashboard.
    (async function checkExistingSession() {
      const token = window.auth.getToken();
      if (!token) return;

      try {
        const res = await window.api.fetch('/auth/me');
        if (res.ok) {
          window.location.href = '/pages/dashboard.html';
        }
      } catch (_) {
        window.auth.clearToken();
      }
    })();

    const form   = document.getElementById('login-form');
    const errMsg = document.getElementById('error-message');
    const btn    = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errMsg.textContent = 'Email dan kata sandi wajib diisi.';
        errMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Masuk';
        return;
      }

      try {
        await window.auth.login(email, password);
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
