<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - CDGS School Core</title>
  <meta name="description" content="Masuk ke platform talent siswa CDGS School Core.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-page">
  <div class="login-wrap">
    <main class="login-card" id="login-card">
      <section class="login-form-panel" aria-labelledby="login-title">
        <p class="login-brand">CDGS <span>School Core</span></p>
        <h1 id="login-title">Selamat datang kembali</h1>
        <p class="login-intro">Masuk ke ruang kerja sekolah Anda.</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              class="form-input"
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              aria-required="true"
            >
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Kata sandi</label>
            <input
              class="form-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              aria-required="true"
            >
          </div>
          <button type="submit" class="btn-primary" id="login-btn">Masuk</button>
          <p class="error-msg" id="error-message" role="alert" aria-live="assertive"></p>
        </form>

        <!-- Quick Demo Account Switcher -->
        <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1);">
          <p style="font-size: 11px; font-weight: 600; color: #8F9DB4; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;">Pilih Akun Demo Cepat:</p>
          <div style="display: flex; flex-wrap: wrap; gap: 6px;">
            <button type="button" class="btn-secondary demo-pill" onclick="fillDemo('admin@devr.sch.id', 'admin123')" style="min-height: 28px; padding: 4px 10px; font-size: 11px; border-color: #8B5CF6; color: #C4B5FD;">🟣 Admin</button>
            <button type="button" class="btn-secondary demo-pill" onclick="fillDemo('kepsek@cdgs.local', 'kepsek123')" style="min-height: 28px; padding: 4px 10px; font-size: 11px; border-color: #3B82F6; color: #93C5FD;">🔵 Kepsek</button>
            <button type="button" class="btn-secondary demo-pill" onclick="fillDemo('guru@cdgs.local', 'guru123')" style="min-height: 28px; padding: 4px 10px; font-size: 11px; border-color: #10B981; color: #6EE7B7;">🟢 Guru</button>
            <button type="button" class="btn-secondary demo-pill" onclick="fillDemo('murid@cdgs.local', 'murid123')" style="min-height: 28px; padding: 4px 10px; font-size: 11px; border-color: #F59E0B; color: #FCD34D;">🟡 Murid</button>
            <button type="button" class="btn-secondary demo-pill" onclick="fillDemo('instansi@cdgs.local', 'instansi123')" style="min-height: 28px; padding: 4px 10px; font-size: 11px; border-color: #EC4899; color: #F9A8D4;">🔴 Instansi</button>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Jika token sudah ada dan valid, langsung ke dashboard.
    (async function checkExistingSession() {
      const token = window.auth.getToken();
      if (!token) return;

      try {
        const res = await window.api.fetch('/auth/me');
        if (res.ok) {
          window.location.href = '/pages/dashboard.html';
        }
      } catch (_) {
        window.auth.clearToken();
      }
    })();

    function fillDemo(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
      document.getElementById('error-message').classList.remove('visible');
      document.getElementById('login-btn').focus();
    }

    const form   = document.getElementById('login-form');
    const errMsg = document.getElementById('error-message');
    const btn    = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errMsg.textContent = 'Email dan kata sandi wajib diisi.';
        errMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Masuk';
        return;
      }

      try {
        await window.auth.login(email, password);
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.classList.add('visible');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
